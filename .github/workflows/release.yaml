name: Release

on:
    release:
        types: [created]

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml
        permissions:
            contents: write
            id-token: write
            pages: write
    docs:
        needs: ci
        runs-on: ubuntu-latest
        name: Docs build and deploy
        permissions:
            contents: write
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Install dependencies
              run: npm install

            - name: Build
              run: npx tsc -b && npx typedoc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./docs

            - name: Deploy
              id: deploy
              uses: actions/deploy-pages@v4

    release:
        runs-on: ubuntu-latest
        needs: ci
        permissions:
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup npm authentication
              uses: actions/setup-node@v6
              with:
                  node-version: latest
                  registry-url: https://registry.npmjs.org/

            - name: Use latest npm version
              run: npm install -g npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npx tsc -b

            - name: Resolve package
              id: resolve
              run: node packages/monorepo/dist/main.js release resolve "$TAG"
              env:
                  TAG: ${{ github.event.release.tag_name }}

            - name: Publish
              run: npm publish --access=public --provenance
              working-directory: ${{ steps.resolve.outputs.path }}
